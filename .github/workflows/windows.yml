name: Windows build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GOARCH: amd64
      npm_config_cache: ${{ github.workspace }}/.cache/npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Build and test
        run: ./build.ps1 -Test

      - name: Package portable application
        run: ./tools/package-release.ps1

      - name: Save download for this run
        uses: actions/upload-artifact@v7
        with:
          name: P4Overlay-windows-x64
          path: dist/P4Overlay-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: P4Overlay-windows-x64
          path: dist

      - name: Create release or update its download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'dist/P4Overlay-windows-x64.zip'
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --repo $env:GH_REPO --clobber
          } else {
            $releaseArgs = @(
              'release', 'create', $env:RELEASE_TAG, $archive,
              '--repo', $env:GH_REPO, '--verify-tag', '--generate-notes',
              '--title', "P4Overlay $env:RELEASE_TAG"
            )
            if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed' }
